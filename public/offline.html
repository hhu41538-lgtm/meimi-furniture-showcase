<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6B2737">
    <title>美觅家居产品图册</title>
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #e9e7e1; color: #1d1c1a; display: flex; justify-content: center; margin: 0; min-height: 100svh; padding: 24px; }
      main { background: #fbfaf7; box-shadow: 0 18px 60px rgba(35, 30, 24, .16); max-width: 430px; min-height: 430px; padding: 40px 28px; position: relative; width: 100%; }
      .mark { background: #6b2737; height: 4px; margin-bottom: 72px; width: 48px; }
      p { color: #78716c; font-size: 14px; line-height: 1.7; margin: 12px 0 28px; }
      small { color: #a8a29e; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
      h1 { font-family: Georgia, serif; font-size: 34px; font-weight: 400; line-height: 1.08; margin: 12px 0 0; }
      button { background: #6b2737; border: 0; color: white; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .14em; padding: 14px 18px; text-transform: uppercase; }
      button:focus-visible { outline: 3px solid #1d1c1a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <small>美觅家居产品图册</small>
      <h1>你的产品图册仍在这里。</h1>
      <p>当前网络连接不可用。恢复网络后即可继续浏览最新产品与空间案例。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
